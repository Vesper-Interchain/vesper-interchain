syntax = "proto3";
package vesperinterchain.stablecoin.v1;

option go_package = "github.com/Vesper-Interchain/vesper-interchain/x/stablecoin/types";

// DebtPosition defines the DebtPosition message.
message DebtPosition {
  uint64 position_id = 1;
  string owner = 2;
  string collateral_type = 3;
  string debt_amount = 4;
  int64 last_updated = 5;
}
