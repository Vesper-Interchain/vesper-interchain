syntax = "proto3";
package vesperinterchain.stablecoin.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "vesperinterchain/stablecoin/v1/params.proto";

option go_package = "github.com/Vesper-Interchain/vesper-interchain/x/stablecoin/types";

// GenesisState defines the stablecoin module's genesis state.
message GenesisState {
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];

  // total_minted tracks total supply minted (string representation of math.Int)
  string total_minted = 2;

  // total_burned tracks total supply burned (string representation of math.Int)
  string total_burned = 3;
}
