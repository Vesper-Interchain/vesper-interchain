syntax = "proto3";
package vesperinterchain.stablecoin.v1;

option go_package = "github.com/Vesper-Interchain/vesper-interchain/x/stablecoin/types";

// StablecoinSupply defines the StablecoinSupply message.
message StablecoinSupply {
  string total_supply = 1;
  string circulating_supply = 2;
  string treasury_balance = 3;
  int64 last_updated = 4;
}
