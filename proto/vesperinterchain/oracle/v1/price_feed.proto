syntax = "proto3";
package vesperinterchain.oracle.v1;

option go_package = "github.com/Vesper-Interchain/vesper-interchain/x/oracle/types";

// PriceFeed defines the PriceFeed message.
message PriceFeed {
  string denom = 1;
  string median_price = 2;
  int64 last_updated = 3;
  int64 valid_sources = 4;
}
