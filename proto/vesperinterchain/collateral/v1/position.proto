syntax = "proto3";
package vesperinterchain.collateral.v1;

option go_package = "github.com/Vesper-Interchain/vesper-interchain/x/collateral/types";

// Position defines the Position message.
message Position {
  uint64 id = 1;
  string owner = 2;
  string collateral_type = 3;
  string collateral_amount = 4;
  string debt_amount = 5;
  string collateral_value = 6;
  int64 last_updated = 7;
}
